<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบบันทึกค่าแรง</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #faf8f4;
      --surface: #ffffff;
      --surface-2: #f3efe8;
      --border: #e2dccf;
      --text: #2b2417;
      --text-muted: #7d7466;
      --primary: #b45309;
      --primary-hover: #92400e;
      --primary-soft: #fef3e2;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --success: #15803d;
      --success-soft: #dcfce7;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(43, 36, 23, 0.08), 0 4px 14px rgba(43, 36, 23, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "IBM Plex Sans Thai", "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    button { cursor: pointer; font: inherit; color: inherit; }

    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .app-header .logo {
      width: 46px; height: 46px;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .app-header h1 { font-size: 20px; font-weight: 700; }
    .app-header p { font-size: 13px; color: var(--text-muted); }

    .tabs {
      display: flex; gap: 6px;
      padding: 12px 20px 0;
      max-width: 860px; margin: 0 auto; width: 100%;
      overflow-x: auto;
    }

    .tab-btn {
      border: 1px solid transparent;
      border-bottom: none;
      background: transparent;
      padding: 10px 18px;
      border-radius: 10px 10px 0 0;
      font-weight: 600; font-size: 15px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--surface);
      border-color: var(--border);
      color: var(--primary);
    }

    .container { max-width: 860px; margin: 0 auto; padding: 0 20px 60px; width: 100%; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0 var(--radius) var(--radius) var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .panel h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .panel .subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      font-size: 15px;
      outline: none;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px;
      border-radius: 8px; border: none;
      font-weight: 600; font-size: 15px;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-danger-ghost { background: transparent; color: var(--danger); padding: 6px 10px; font-size: 13px; }

    .card-list { display: grid; gap: 12px; margin-top: 8px; }

    .item-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      background: var(--surface);
      display: flex; justify-content: space-between; gap: 14px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      margin-top: 6px;
    }

    .badge-role { background: var(--primary-soft); color: var(--primary); }
    .badge-days { background: var(--success-soft); color: var(--success); }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 12px 10px; font-size: 14.5px; }
    thead th { border-bottom: 2px solid var(--border); font-size: 13.5px; color: var(--text-muted); }
    tbody tr { border-bottom: 1px solid var(--border); }
    td.num, th.num { text-align: right; }
    .total-row td { font-weight: 700; background: var(--surface-2); }

    .empty { text-align: center; padding: 36px 16px; color: var(--text-muted); }

    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text); color: #fff;
      padding: 12px 22px; border-radius: 999px;
      font-size: 14.5px; opacity: 0;
      transition: all 0.25s ease; z-index: 50;
    }

    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .hidden { display: none !important; }

    .auth-overlay {
      position: fixed; inset: 0;
      background: rgba(43, 36, 23, 0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }

    .auth-card {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      width: 100%; max-width: 360px;
      box-shadow: var(--shadow);
    }

    .auth-error { color: var(--danger); font-size: 14px; margin-bottom: 10px; min-height: 18px; }

    .auth-actions { display: flex; gap: 10px; margin-top: 12px; }
    .auth-actions .btn { flex: 1; }

    @media (max-width: 560px) {
      .panel { padding: 18px; border-radius: var(--radius); margin-top: 12px; }
      .item-card { flex-direction: column; }
    }
  </style>
</head>

<body>
  <div class="auth-overlay" id="auth-overlay">
    <div class="auth-card">
      <h2>สมัคร / เข้าสู่ระบบ</h2>
      <p>กรอกข้อมูลเพื่อสมัครหรือเข้าใช้งาน</p>

      <div class="auth-error" id="auth-error"></div>

      <div class="field">
        <label for="auth-email">อีเมล</label>
        <input type="email" id="auth-email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label for="auth-password">รหัสผ่าน</label>
        <input type="password" id="auth-password" placeholder="••••••••" />
      </div>

      <div class="field">
        <label for="signup-name">ชื่อ</label>
        <input type="text" id="signup-name" placeholder="ชื่อ-นามสกุล" />
      </div>

      <div class="field">
        <label for="signup-role">ตำแหน่ง</label>
        <input type="text" id="signup-role" placeholder="ช่าง / ผู้ช่วย" />
      </div>

      <div class="auth-actions">
        <button class="btn btn-primary" id="login-btn">เข้าสู่ระบบ</button>
        <button class="btn" id="signup-btn">สมัครใช้งาน</button>
      </div>
    </div>
  </div>

  <header class="app-header">
    <div class="logo" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1z" />
        <path d="M4 10V8a8 8 0 0 1 8-8 8 8 0 0 1 8 8v2" />
        <path d="M10 8h4" />
      </svg>
    </div>
    <div>
      <h1>ระบบบันทึกค่าแรง</h1>
      <p>บันทึกคนงาน วันทำงาน และสรุปยอด</p>
